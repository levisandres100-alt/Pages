    <style>
        body {
            font-family: 'Arial', sans-serif; 
            margin: 40px auto;
            max-width: 600px; 
            padding: 20px;
            background-color: var(--card-bg, #ffffff);
            color: var(--card-text, #333333);
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1 {
            color: #ffd711; 
            text-align: center;
            font-size: 28px;
        }

        .btn-regresar {
            display: inline-block;
            text-align: center;
            background-color: #555;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 20px;
        }

        .grid-botones {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 15px;                      
            margin: 25px 0;
            width: 100%;
        }

        .tarjeta-categoria {
            display: flex;
            flex-direction: column;         
            align-items: center;
            text-decoration: none;
            background-color: var(--card-bg, #ffffff);      
            border: 1px solid rgba(0,0,0,0.1);
            color: inherit;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .tarjeta-categoria:hover {
            transform: translateY(-4px);    
            box-shadow: 0 6px 15px rgba(0,0,0,0.18);
        }

        .imagen-categoria {
            width: 100%;
            height: 120px;                  
            object-fit: contain;              
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .tarjeta-categoria button {
            background-color: #ffd711;
            color: #ffffff;
            border: none;
            padding: 10px 15px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .tarjeta-categoria button:hover {
            background-color: #b82c2c;
        }
    </style>
</head>
<body>
