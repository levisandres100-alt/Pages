<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bocinas - Hipercel</title>
    <link rel="stylesheet" href="estilos.css?v=109">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 40px auto;
            max-width: 600px;
            padding: 20px;
            background-color: var(--card-bg, #ffffff);
            color: var(--card-text, #333333);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1 {
            color: #ffd711;
            text-align: center;
            font-size: 28px;
        }

        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .card-producto img {
            width: 100%;
            height: 180px; 
            object-fit: contain; 
            background-color: rgba(0,0,0,0.05); 
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer; 
        }

        .card-producto p.descripcion-texto {
            white-space: pre-line !important;
            text-align: left;
            font-size: 14px;
            margin: 10px 0;
            color: inherit !important;
        }

        .card-producto h4, 
        .card-producto strong {
            color: inherit !important;
        }

        .btn-agregar {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .btn-whatsapp {
            display: inline-block;
            background-color: #25D366;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 8px;
        }

        .btn-regresar {
            display: inline-block;
            background-color: #555;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 20px;
        }

        /* --- Lightbox --- */
        .lightbox-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .lightbox-overlay img {
            max-width: 90%;
            max-height: 90%;
            border: 3px solid white;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            cursor: default;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div id="lightboxOverlay" class="lightbox-overlay" onclick="cerrarImagen()">
        <span class="lightbox-close">&times;</span>
        <img id="lightboxImg" src="" alt="Imagen en grande">
    </div>

    <h1>🔊 Bocinas</h1>
    <p>Revisá nuestras opciones disponibles en inventario:</p>

    <div id="contenedorProductos" class="catalogo-grid">
        <p>Cargando productos...</p>
    </div>

    <a href="acc.html" class="btn-regresar">← Volver a Categorías</a>

    <div id="boton-carrito-flotante" onclick="document.getElementById('modal-carrito').style.display='block'" style="position:fixed; bottom:20px; right:20px; background:#e63946; color:#fff; padding:12px 20px; border-radius:50px; cursor:pointer; z-index:1000; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,0.3);">
      🛒 Carrito (<span id="cant-carrito">0</span>)
    </div>

    <div id="modal-carrito" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1001;">
      <div style="width:90%; max-width:400px; margin:100px auto; padding:20px; border-radius:8px; position:relative;">
        <span onclick="document.getElementById('modal-carrito').style.display='none'" style="position:absolute; right:15px; top:10px; cursor:pointer; font-size:20px; font-weight:bold;">&times;</span>
        
        <h2 style="margin-top:0;">Tu Pedido</h2>
        <hr style="margin-bottom:15px;">
        
        <div id="items-carrito"></div>
        
        <div style="margin-top:20px; text-align:right;">
          <strong>Total: <span id="total-carrito">Q0.00</span></strong>
        </div>

        <button onclick="enviarPedidoWhatsApp('50251636313')" style="width:100%; background:#25D366; color:#fff; border:none; padding:12px; margin-top:15px; border-radius:5px; font-weight:bold; cursor:pointer;">
          Pedir todo por WhatsApp
        </button>
      </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xvycvutivqtmuebupgpe.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_as_GTYju2JC6y5x_GkwRFg_P3sOrKZ2";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cargarbocinas() {
            const contenedor = document.getElementById('contenedorProductos');

            const { data: productos, error } = await db
                .from('productos')
                .select('*')
                .eq('categoria', 'bocinas')
                .order('id', { ascending: false });

            if (error) {
                console.error("Error:", error);
                contenedor.innerHTML = "<p>Error al cargar inventario.</p>";
                return;
            }

            if (productos.length === 0) {
                contenedor.innerHTML = "<p>No hay productos registrados en este momento.</p>";
                return;
            }

            contenedor.innerHTML = "";

            productos.forEach(prod => {
                const mensajeWA = encodeURIComponent(`Hola, me interesa el producto: ${prod.nombre}`);
                const precioProd = prod.precio ? prod.precio : 0; 

                contenedor.innerHTML += `
                    <div class="card-producto">
                        <img src="${prod.imagen_url}" alt="${prod.nombre}" onclick="ampliarImagen('${prod.imagen_url}')">
                        <h4>${prod.nombre}</h4>
                        <p class="descripcion-texto">${prod.descripcion || ''}</p>
                        <p><strong>Q${precioProd}</strong></p>
                        
                        <button class="btn-agregar" onclick="agregarAlCarrito(${prod.id}, '${prod.nombre}', ${precioProd}, '${prod.imagen_url}')">
                            Agregar al carrito
                        </button>

                        <a href="https://wa.me/50251636313?text=${mensajeWA}" class="btn-whatsapp" target="_blank">Consultar por WhatsApp</a>
                    </div>
                `;
            });
        }

        cargarbocinas();

        function ampliarImagen(url) {
            const overlay = document.getElementById('lightboxOverlay');
            const imgAmpliada = document.getElementById('lightboxImg');
            imgAmpliada.src = url;
            overlay.style.display = 'flex';
        }

        function cerrarImagen() {
            const overlay = document.getElementById('lightboxOverlay');
            overlay.style.display = 'none';
        }
    </script>
    
    <div id="sidebar-container"></div>
    <script src="carrito.js"></script>
    <script src="sidebar.js"></script>
</body>
</html>
