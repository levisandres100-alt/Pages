  /* --- BOTÓN FLOTANTE DEL MENÚ --- */
.btn-sidebar-toggle {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 999;
  background-color: var(--primary, #ffd711);
  color: rgb(255, 255, 255);
  border: none;
  font-size: 22px;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  transition: transform 0.2s ease;
}
.btn-sidebar-toggle:hover {
  transform: scale(1.05);
}

/* --- PANEL LATERAL Y OVERLAY --- */
.sidebar-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
.sidebar-overlay.active {
  opacity: 1;
  visibility: visible;
}

.sidebar-panel {
  position: fixed;
  top: 0;
  left: -300px; /* Oculto a la izquierda */
  width: 280px;
  height: 100%;
  background-color: var(--bg-sidebar, #ffffff);
  color: var(--text-sidebar, #333333);
  z-index: 1001;
  box-shadow: 4px 0 15px rgba(0,0,0,0.3);
  transition: left 0.3s ease;
  display: flex;
  flex-direction: column;
}
.sidebar-panel.active {
  left: 0; /* Aparece en pantalla */
}

/* Header del Sidebar */
.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 20px;
  border-bottom: 1px solid rgba(0,0,0,0.1);
}
.sidebar-header h3 { margin: 0; font-size: 20px; }
.btn-close {
  background: none; border: none; font-size: 28px;
  cursor: pointer; color: inherit;
}

/* Contenido del Sidebar */
.sidebar-content { padding: 20px; overflow-y: auto; }
.sidebar-section h4 { margin-top: 0; font-size: 14px; text-transform: uppercase; color: #888; letter-spacing: 1px; }
.sidebar-menu { list-style: none; padding: 0; margin: 15px 0; }
.sidebar-menu li { margin-bottom: 12px; }
.sidebar-menu a {
  text-decoration: none;
  color: inherit;
  font-weight: bold;
  font-size: 15px;
  display: block;
  padding: 8px 10px;
  border-radius: 6px;
  transition: background 0.2s;
}
.sidebar-menu a:hover { background: rgba(0,0,0,0.06); }
.sidebar-divider { border: none; border-top: 1px solid rgba(0,0,0,0.1); margin: 20px 0; }

/* Botones de Temas */
.theme-subtitle { font-size: 13px; color: #666; margin-bottom: 10px; }
.theme-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-theme {
  border: none;
  padding: 10px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  font-size: 13px;
  transition: opacity 0.2s;
}
.btn-theme:hover { opacity: 0.85; }
.theme-light { background-color: #f4f6f8; color: #333; border: 1px solid #ccc; }
.theme-dark { background-color: #1e1e1e; color: #ffffff; }
.theme-coffee { background-color: #4a2822; color: #d7ccc8; }
.theme-blue { background-color: #5073a9; color: #e3f2fd; }

/* --- TEMAS (Variables Globales de Color) --- */
body.theme-dark {
  background-color: #121212 !important;

body.theme-blue {

}
 
#btn-close-sidebar {
  font-size: 22px !important;
  width: 40px !important;
  height: 40px !important;
  line-height: 1 !important;
  box-sizing: border-box !important;
  background: transparent !important;
  /* Se adapta al color de texto principal del tema activo */
  color: currentColor !important; 
  opacity: 0.8;
  transition: opacity 0.2s ease;
}

#btn-close-sidebar:hover {
  opacity: 1;
}
