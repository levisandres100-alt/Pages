<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Auto-Motocentro</title>
  <link rel="stylesheet" href="estilos.css">
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --primary: #ffd711;
      --dark: #1d3557;
      --light: #f1faee;
      --gray: #457b9d;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f8; color: #333; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1, h2 { text-align: center; color: var(--dark); margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--dark); }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { width: 100%; padding: 12px; background: var(--primary); color: #000; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    button:hover { opacity: 0.85; }
    .btn-logout { background: #6c757d; color: white; margin-bottom: 20px; }
    .hidden { display: none; }
    .product-list { margin-top: 30px; }
    .product-item { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; gap: 10px; }
    .product-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
    .btn-delete { background: #e63946; color: white; width: auto; padding: 6px 12px; font-size: 14px; margin-top: 0; }
    .btn-edit { background: #ffb703; color: #000; width: auto; padding: 6px 10px; font-size: 12px; margin-top: 0; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <!-- PANTALLA DE LOGIN -->
    <div id="loginSection">
      <h1>🏎️ Panel de Administración</h1>
      <form id="loginForm">
        <div class="form-group">
          <label>Correo Electrónico:</label>
          <input type="email" id="loginEmail" required placeholder="tu-correo@gmail.com">
        </div>
        <div class="form-group">
          <label>Contraseña:</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit">Iniciar Sesión</button>
      </form>
    </div>

    <!-- PANTALLA DEL PANEL DE CONTROL -->
    <div id="adminSection" class="hidden">
      <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
      <h2>📦 Agregar Nuevo Producto</h2>
      
      <form id="productForm">
        <div class="form-group">
          <label>Nombre del Producto:</label>
          <input type="text" id="prodNombre" placeholder="Ej. Aceite Castrol 20W-50" required>
        </div>

        <div style="display: flex; gap: 10px;">
          <div class="form-group" style="flex: 1;">
            <label>Precio (Q):</label>
            <input type="number" id="prodPrecio" step="0.01" placeholder="Ej. 150.00" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Stock inicial (Unidades):</label>
            <input type="number" id="prodStock" min="0" placeholder="Ej. 10" required>
          </div>
        </div>

        <div class="form-group">
          <label>Categoría y Vehículo:</label>
          <select id="prodCategoria" required>
            <optgroup label="Carros 🚗">
              <option value="aceitesylubricantes">Aceites y Lubricantes (Carros)</option>
              <option value="sistemadefrenos">Sistema de Frenos (Carros)</option>
              <option value="motorydistribuicion">Motor y Distribución (Carros)</option>
              <option value="suspensionyshocks">Suspensión y Shocks (Carros)</option>
              <option value="baterias">Baterías (Carros)</option>
            </optgroup>
            <optgroup label="Motos 🏍️">
              <option value="aceitesylubricantesm">Aceites y Lubricantes (Motos)</option>
              <option value="sistemadefrenosm">Sistema de Frenos (Motos)</option>
              <option value="motorydistribuicionm">Motor y Distribución (Motos)</option>
              <option value="suspensionyshocksm">Suspensión y Shocks (Motos)</option>
              <option value="bateriasm">Baterías (Motos)</option>
            </optgroup>
          </select>
        </div>

        <div class="form-group">
          <label>Descripción / Detalle:</label>
          <textarea id="prodDescripcion" rows="2" placeholder="Ej. Garrafa de 1 Galón..."></textarea>
        </div>

        <div class="form-group">
          <label>Foto del Producto:</label>
          <input type="file" id="prodImagen" accept="image/*" required>
        </div>

        <button type="submit" id="btnGuardar">Subir Producto</button>
      </form>

      <!-- LISTA DE PRODUCTOS SUBIDOS -->
    
      <div class="product-list">
        <h2>📋 Productos en la Web</h2>

        <!-- FILTRADOR DE CATEGORÍAS -->
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="filtroCategoria">Filtrar por categoría:</label>
          <select id="filtroCategoria" onchange="cargarProductos()">
            <option value="todas">Ver todas las categorías</option>
            <optgroup label="Carros 🚗">
              <option value="aceitesylubricantes">Aceites y Lubricantes (Carros)</option>
              <option value="sistemadefrenos">Sistema de Frenos (Carros)</option>
              <option value="motorydistribuicion">Motor y Distribución (Carros)</option>
              <option value="suspensionyshocks">Suspensión y Shocks (Carros)</option>
              <option value="baterias">Baterías (Carros)</option>
            </optgroup>
            <optgroup label="Motos 🏍️">
              <option value="aceitesylubricantesm">Aceites y Lubricantes (Motos)</option>
              <option value="sistemadefrenosm">Sistema de Frenos (Motos)</option>
              <option value="motorydistribuicionm">Motor y Distribución (Motos)</option>
              <option value="suspensionyshocksm">Suspensión y Shocks (Motos)</option>
              <option value="bateriasm">Baterías (Motos)</option>
            </optgroup>
          </select>
        </div>

        <div id="listaProductos">Cargando productos...</div>
      </div>
        <div id="listaProductos">Cargando productos...</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://exsegshoihdoofefjryt.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_bN19uH5ODfBYvVTnW0oE7g_cFUqMaRN"; 

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginSection = document.getElementById('loginSection');
    const adminSection = document.getElementById('adminSection');
    const loginForm = document.getElementById('loginForm');
    const productForm = document.getElementById('productForm');
    const btnLogout = document.getElementById('btnLogout');
    const listaProductos = document.getElementById('listaProductos');

    // Verificar sesión
    async function checkUser() {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        loginSection.classList.add('hidden');
        adminSection.classList.remove('hidden');
        cargarProductos();
      } else {
        loginSection.classList.remove('hidden');
        adminSection.classList.add('hidden');
      }
    }
    checkUser();

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const { data, error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        alert("Error al iniciar sesión: " + error.message);
      } else {
        checkUser();
      }
    });

    // Logout
    btnLogout.addEventListener('click', async () => {
      await db.auth.signOut();
      checkUser();
    });

    // Guardar Producto en BD
    productForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnGuardar');
      btn.innerText = "Subiendo...";
      btn.disabled = true;

      const nombre = document.getElementById('prodNombre').value;
      const precio = parseFloat(document.getElementById('prodPrecio').value);
      const stock = parseInt(document.getElementById('prodStock').value);
      const categoria = document.getElementById('prodCategoria').value;
      const descripcion = document.getElementById('prodDescripcion').value;
      const fileInput = document.getElementById('prodImagen');
      const file = fileInput.files[0];

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        const filePath = `${fileName}`;

        const { error: uploadError } = await db.storage
          .from('imagenes')
          .upload(filePath, file);

        if (uploadError) throw uploadError;

        const { data: urlData } = db.storage
          .from('imagenes')
          .getPublicUrl(filePath);

        const imagenUrl = urlData.publicUrl;

        // Determinar el icono según si la categoría es de Moto (termina en 'm') o Carro
        const esMoto = categoria.endsWith('m');
        const vehiculo = esMoto ? 'moto' : 'carro';

        // Insertar en la tabla 'productos'
        const { error: dbError } = await db
          .from('productos')
          .insert([{ nombre, precio, stock, categoria, vehiculo, descripcion, imagen_url: imagenUrl }]);

        if (dbError) throw dbError;

        alert("¡Producto guardado exitosamente!");
        productForm.reset();
        cargarProductos();

      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        btn.innerText = "Subir Producto";
        btn.disabled = false;
      }
    });

   // Mostrar lista en el Panel Admin (Con filtro aplicado)
    async function cargarProductos() {
      const filtro = document.getElementById('filtroCategoria')?.value || 'todas';
      listaProductos.innerHTML = "<p style='text-align:center;'>Cargando productos...</p>";

      // Preparar consulta a Supabase
      let query = db.from('productos').select('*');

      // Si el usuario eligió una categoría en específico, filtramos por esa columna
      if (filtro !== 'todas') {
        query = query.eq('categoria', filtro);
      }

      // Ordenar los más recientes primero
      const { data, error } = await query.order('id', { ascending: false });

      if (error) {
        listaProductos.innerHTML = "Error al cargar productos.";
        return;
      }

      if (!data || data.length === 0) {
        listaProductos.innerHTML = "<p style='text-align:center; color:#666;'>No hay productos en esta categoría.</p>";
        return;
      }

      listaProductos.innerHTML = "";
      data.forEach(prod => {
        const item = document.createElement('div');
        item.className = 'product-item';
        
        const iconoVehiculo = (prod.categoria && prod.categoria.endsWith('m')) || prod.vehiculo === 'moto' ? '🏍️' : '🚗';
        const precioTxt = `Q${parseFloat(prod.precio).toFixed(2)}`;
        const estadoTxt = prod.stock > 0 
          ? `<span style="color:#2a9d8f; font-weight:bold;">${prod.stock} unids.</span>` 
          : `<span style="color:#e63946; font-weight:bold;">Agotado</span>`;

        const nombreEscapado = prod.nombre.replace(/'/g, "\\'");

        item.innerHTML = `
          <img src="${prod.imagen_url}" alt="${prod.nombre}">
          <div style="flex:1;">
            <strong>${prod.nombre} ${iconoVehiculo}</strong><br>
            <small>${precioTxt} | ${estadoTxt}</small>
            <!-- BOTONERA RÁPIDA DE STOCK -->
            <div style="margin-top: 5px;">
              <button onclick="cambiarStock(${prod.id}, ${prod.stock}, -1)" style="width:auto; padding: 2px 8px; font-size:12px; background:#457b9d; margin-top:0; color:white;">-1</button>
              <button onclick="cambiarStock(${prod.id}, ${prod.stock}, 1)" style="width:auto; padding: 2px 8px; font-size:12px; background:#2a9d8f; margin-top:0; color:white;">+1</button>
            </div>
          </div>
          
          <!-- BOTÓN PARA CAMBIAR PRECIO -->
          <button class="btn-edit" onclick="editarPrecio(${prod.id}, '${nombreEscapado}', ${prod.precio})">✏️ Precio</button>
          
          <!-- BOTÓN PARA BORRAR -->
          <button class="btn-delete" onclick="eliminarProducto(${prod.id})">Borrar</button>
        `;
        listaProductos.appendChild(item);
      });
    }
    // Cambiar stock
    async function cambiarStock(id, stockActual, cambio) {
      const nuevoStock = Math.max(0, stockActual + cambio);
      const { error } = await db.from('productos').update({ stock: nuevoStock }).eq('id', id);
      if (!error) cargarProductos();
    }

    // Borrar producto
    async function eliminarProducto(id) {
      if (confirm("¿Estás seguro de eliminar este producto?")) {
        const { error } = await db.from('productos').delete().eq('id', id);
        if (error) {
          alert("Error: " + error.message);
        } else {
          cargarProductos();
        }
      }
    }

    // Editar precio
    async function editarPrecio(idActual, nombreActual, precioActual) {
      const nuevoPrecio = prompt(`Ingresá el nuevo precio para "${nombreActual}":`, precioActual);

      if (nuevoPrecio !== null && nuevoPrecio.trim() !== "") {
        const precioParseado = parseFloat(nuevoPrecio);

        if (isNaN(precioParseado) || precioParseado < 0) {
          return alert("❌ Por favor ingresá un precio válido.");
        }

        const { error } = await db
          .from('productos')
          .update({ precio: precioParseado })
          .eq('id', idActual);

        if (error) {
          alert("Error al actualizar el precio: " + error.message);
        } else {
          alert(`¡Éxito! El precio de "${nombreActual}" cambió a Q${precioParseado.toFixed(2)}.`);
          cargarProductos();
        }
      }
    }
  </script>
</body>
</html>
